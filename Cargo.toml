[package]
name = "wasm-app-brave-search"
version = "0.1.0"
edition = "2021"
description = "Brave Web Search MCP tool for the Privasys enclave runtime"
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.39", features = ["bitflags"] }

[package.metadata.component]
package = "privasys:brave-search"

[package.metadata.component.target.dependencies]
"wasi:io" = { path = "wit/deps/io" }
"wasi:clocks" = { path = "wit/deps/clocks" }
"wasi:random" = { path = "wit/deps/random" }
"wasi:cli" = { path = "wit/deps/cli" }
"privasys:enclave-os" = { path = "wit/deps/enclave-os" }

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
